<script>
(function(){
  if(!/collection-type-blog/.test(document.body.className))return;
  var f=document.querySelector('.lb-blog-foot');var site=document.getElementById('siteWrapper')||document.body;
  if(f&&site!==f.parentNode){site.appendChild(f);}
  var nav=document.querySelector('.header-display-desktop .header-nav-list');
  if(nav&&!document.querySelector('.lb-blog-order')){
    var a=document.createElement('a');a.className='lb-blog-order';a.textContent='Order';
    a.href='https://la-bonita-brunch-redmond.cloveronline.com/menu/all';a.target='_blank';a.rel='noopener';
    nav.parentNode.appendChild(a);
  }
})();
</script>
